name: Release

# Pushing a version tag is the whole release trigger: the test matrix gates it,
# the release notes come from the conventional commits since the previous tag,
# and the npm tarball is staged for the maintainer to approve.
on:
  push:
    tags: ['v[0-9]*']

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # The suite needs no dependencies, so there is nothing to cache.
          package-manager-cache: false

      # The suite creates real repositories; git needs an identity and must not
      # rewrite line endings, otherwise the CRLF-sensitive cases change meaning.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main

      - name: Test
        run: npm test

  release:
    name: GitHub release + npm stage (${{ github.ref_name }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: this OIDC identity *is* the publish credential,
      # so there is no NPM_TOKEN anywhere in the repository or its secrets.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes diff this tag against the previous one, so the whole
          # tag history has to be present.
          fetch-depth: 0

      # Trusted publishing needs npm CLI >= 11.16, and staged publishing came
      # with the same generation of the CLI; Node 24 ships a new enough one,
      # Node 22 does not.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The suite needs no dependencies, so there is nothing to cache.
          package-manager-cache: false

      - name: Check the npm CLI can stage a trusted publish
        run: |
          set -euo pipefail
          version="$(npm -v)"
          echo "npm ${version}"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && minor < 16)) {
              console.error("npm " + process.argv[1] + " is too old: trusted publishing needs >= 11.16")
              process.exit(1)
            }
          ' "${version}"
          npm stage publish --help >/dev/null

      - name: Build the release notes
        run: node scripts/release-notes.js --tag "${{ github.ref_name }}" --output "${RUNNER_TEMP}/notes.md"

      - name: Show the notes in the log
        run: cat "${RUNNER_TEMP}/notes.md"

      # A re-run of the same tag must refresh the release instead of failing.
      # Tags carrying a prerelease suffix (v1.2.0-rc.1) are marked as such.
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              ${PRERELEASE}
          fi

      # The tarball goes to npm's staging queue, not to the registry: it stays
      # uninstallable until the maintainer approves it with 2FA. The identity
      # comes from OIDC, so npm rejects this unless the package's Trusted
      # Publisher lists yann9 / dsh-git-workbench / release.yml (Environment
      # left blank) *and* allows `npm stage publish`.
      # The script checks the tarball it packed: DSH needs the bundle manifest
      # and every client chunk to be inside it.
      - name: Stage the version on npm
        id: stage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/stage-release.js --version "${VERSION}" \
            --registry=https://registry.npmjs.org/

      - name: Report how to approve the staged version
        env:
          STATUS: ${{ steps.stage.outputs.status }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${STATUS}" != "staged" ]]; then
            echo "::notice::${VERSION} was already on npm, nothing to approve"
            exit 0
          fi
          {
            echo "### npm staged publish"
            echo
            echo "The tarball of \`${VERSION}\` is on npm's staging queue. It is **not**"
            echo "installable until it is approved with 2FA:"
            echo
            echo '```bash'
            echo "npm stage approve ${STAGE_ID} --registry=https://registry.npmjs.org/"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::${VERSION} is staged as ${STAGE_ID}; approve it with 'npm stage approve ${STAGE_ID}'"
